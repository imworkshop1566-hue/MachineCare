<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Machine Repair </title><link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head><body>
<header class="hero-banner">

    <img
        src="images/machinecare-logo.png"
        alt="MachineCare"
        class="hero-logo">

</header>
 <label>🛠 Machine Repair History</label>
<div class="container"><div class="form-group">
    <label>หมายเลขเครื่องจักร</label>
    <select
    id="machineFilter"
    onchange="updateDamagePoint()">
        <option value="">🔧 เลือกหมายเลขเครื่อง</option>
        
    </select>
</div>

<div class="form-group">
    <label>จุดที่เกิดความเสียหาย</label>
    <select id="damageFilter">
        <option value="">⚠️ เลือกจุดที่เสีย</option>
    </select>
</div>

</select>
<input type="date" id="dateFrom">
<input type="date" id="dateTo">
<button onclick="filterData()">
    Search</button></div>
    
  
         <table><thead><tr><th>Date</th><th>Machine</th><th>Point</th><th>Symptom</th><th>Detail</th></tr></thead>
            <tbody id="tableBody"></tbody>
            <div id="mobileHistory"></div>
        </table><div id='mobileHistory'></div></div><div class='modal' id='detailModal'><div class='modal-content'><span onclick='closeModal()'>✖</span><div id='detailContent'></div></div></div><script src='app.js'></script></body></html>
